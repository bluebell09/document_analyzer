[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "example_package_jesszheng2"
version = "0.0.1"
authors = [
  { name="Example Author J", email="authorJ@example.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "jieba==0.42.1",
    "pydantic==2.13.5",
]

[project.scripts]
run-analyzer = "example_package_jesszheng2.main:start"
